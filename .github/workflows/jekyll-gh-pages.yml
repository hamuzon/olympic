
# Jekyll build and deploy to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Inject Google Analytics and normalization script
        shell: bash
        run: |
          set -euo pipefail

          # JekyllのDockerビルドで生成されたファイルの書き込み権限を修正
          chmod -R u+rwX ./_site

          # HTMLファイルにGoogle Analyticsと末尾ドット正規化を追加
          find ./_site -type f -name "*.html" ! -name "google*.html" -print0 |
          while IFS= read -r -d '' file; do
            # Google Analyticsが既にある場合は重複挿入しない
            if grep -q 'G-F8HVYVW05H' "$file"; then
              # Google Analyticsがあっても正規化スクリプトがなければ追加
              if ! grep -q 'hostname.endsWith' "$file"; then
                sed -i '/<head[^>]*>/a\
          <script>if(window.location.hostname.endsWith(".")){window.location.replace(window.location.href.replace(window.location.hostname,window.location.hostname.slice(0,-1)));}</script>' "$file"
              fi
              continue
            fi

            # <head>直後に挿入
            sed -i '/<head[^>]*>/a\
          <!-- Google tag (gtag.js) -->\
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-F8HVYVW05H"></script>\
          <script>\
          window.dataLayer = window.dataLayer || [];\
          function gtag(){dataLayer.push(arguments);}\
          gtag('\''js'\'', new Date());\
          gtag('\''config'\'', '\''G-F8HVYVW05H'\'');\
          </script>\
          <script>if(window.location.hostname.endsWith(".")){window.location.replace(window.location.href.replace(window.location.hostname,window.location.hostname.slice(0,-1)));}</script>' "$file"
          done

      - name: Remove files from deployment artifact
        shell: bash
        run: |
          rm -rf \
            ./_site/functions \
            ./_site/README.md \
            ./_site/README \
            ./_site/readme.md \
            ./_site/license \
            ./_site/LICENSE \
            ./_site/LICENSE.txt \
            ./_site/_redirects.md \
            ./_site/_redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
