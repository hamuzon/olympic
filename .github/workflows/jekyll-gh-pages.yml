# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Inject Google Analytics and normalization script into HTML
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          analytics = """<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-F8HVYVW05H"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-F8HVYVW05H');
          </script>
          <script>
            if (window.location.hostname.endsWith(".")) {
              window.location.replace(
                window.location.href.replace(
                  window.location.hostname,
                  window.location.hostname.slice(0, -1)
                )
              );
            }
          </script>"""

          for path in Path("./_site").rglob("*.html"):
              if path.name.startswith("google"):
                  continue

              html = path.read_text(encoding="utf-8")

              # Skip files that already contain this Google Analytics tag
              if "G-F8HVYVW05H" in html:
                  print(f"Skipped (Analytics already present): {path}")
                  continue

              # Insert scripts immediately after the first <head> tag
              updated_html, count = re.subn(
                  r"<head\b[^>]*>",
                  lambda match: match.group(0) + "\n" + analytics,
                  html,
                  count=1,
                  flags=re.IGNORECASE
              )

              if count:
                  path.write_text(updated_html, encoding="utf-8")
                  print(f"Updated: {path}")
              else:
                  print(f"Skipped (no <head> tag): {path}")
          PY

      - name: Remove sensitive files from deployment artifact
        run: |
          # デプロイ対象から削除
          rm -rf ./_site/functions \
            ./_site/README.md \
            ./_site/README \
            ./_site/readme.md \
            ./_site/license \
            ./_site/LICENSE \
            ./_site/LICENSE.txt \
            ./_site/_redirects.md \
            ./_site/_redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5