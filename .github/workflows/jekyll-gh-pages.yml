
# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Inject normalization script and Google Analytics
        shell: bash
        run: |
          set -euo pipefail

          sudo chown -R "$USER:$USER" ./_site
          cd ./_site

          find . -type f -name "*.html" ! -name "google*.html" -print0 |
          while IFS= read -r -d '' file; do
            if ! grep -qi '<head[^>]*>' "$file"; then
              echo "Skipping HTML without head: $file"
              continue
            fi

            if grep -q 'G-F8HVYVW05H' "$file"; then
              echo "Google Analytics already exists: $file"
              continue
            fi

            sed -i '/<head[^>]*>/a\
          <script>\
          if (window.location.hostname.endsWith(".")) {\
            window.location.replace(window.location.href.replace(window.location.hostname, window.location.hostname.slice(0, -1)));\
          }\
          </script>\
          <!-- Google tag (gtag.js) -->\
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-F8HVYVW05H"></script>\
          <script>\
          window.dataLayer = window.dataLayer || [];\
          function gtag(){dataLayer.push(arguments);}\
          gtag("js", new Date());\
          gtag("config", "G-F8HVYVW05H");\
          </script>' "$file"

            echo "Updated: $file"
          done

      - name: Remove sensitive files from deployment artifact
        shell: bash
        run: |
          set -euo pipefail

          sudo chown -R "$USER:$USER" ./_site
          cd ./_site

          rm -rf \
            functions \
            README.md \
            README \
            readme.md \
            license \
            LICENSE \
            LICENSE.txt \
            _redirects.md \
            _redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
